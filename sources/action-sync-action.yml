# action.yml
name: "action-sync"
description: "sync file to organization all repositories"
author: myml
branding:
  icon: align-center
  color: "white"
inputs:
  files:
    description: "config files"
    required: false
  files-from:
    description: "read config list from file"
    required: false
    default: ".file_does_not_exist_336fcd84573cf94d21ec"
  message:
    description: "commit message"
    required: false
    default: "chore: Sync by .github"
  pull-request:
    description: "Create or update a pull request for each target branch; requires gh authentication"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@v2
      with:
        go-version: ^1.17.1
    - name: Install binary
      shell: bash
      run: |
        cd $GITHUB_ACTION_PATH
        go build
    - name: Sync
      shell: bash
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_FILES_FROM: ${{ inputs.files-from }}
        INPUT_MESSAGE: ${{ inputs.message }}
        INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
      run: |
        set -euo pipefail
        files="$INPUT_FILES"
        if [ -f "$INPUT_FILES_FROM" ]; then
          files="$(cat "$INPUT_FILES_FROM")"
        fi
        "$GITHUB_ACTION_PATH/action-sync" -files="$files" -message="$INPUT_MESSAGE" -pull-request="$INPUT_PULL_REQUEST"
